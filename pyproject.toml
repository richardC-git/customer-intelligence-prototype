[project]
name = "sfs-customer-intelligence"
version = "0.1.0"
description = "Prototype customer intelligence tool for SFS Group: prospect profiling, key account monitoring, and competitor monitoring (BCIT ISSP)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
sfs-intelligence = "sfs_intelligence.cli:main"

[tool.setuptools.package-data]
sfs_intelligence = ["research/*.toml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]