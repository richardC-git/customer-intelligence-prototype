[project]
name = "sfs-customer-intelligence"
version = "0.1.0"
description = "Prototype customer intelligence tool for SFS Group: prospect profiling, key account monitoring, and competitor monitoring (BCIT ISSP)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
copilot = [
    "github-copilot-sdk>=1.0",
]

[project.scripts]
sfs-intelligence = "sfs_intelligence.cli:main"

[tool.setuptools.package-data]
sfs_intelligence = ["research/*.toml", "llm/prompts/*.md"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real model service; needs LLM_* settings and may cost money (run with pytest -m live)",
]